<!DOCTYPE html>
<html>
    <head>
        <title>Create Resume</title>
        <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
        >
    </head>

    <body>
        <h1>Create Your Resume</h1>

        <form method="POST" class="resume-form">

            <h2>Personal Information</h2>

            <label>Name:</label>
            <input type="text" name="name">
            <br><br>

            <label>Email:</label>
            <input type="email" name="email">
            <br><br>

            <label>Date of Birth:</label>
            <input type="text" name="date_of_birth">
            <br><br>

            <label>Phone Number:</label>
            <input type="text" name="phone_number">
            <br><br>

            <label>Location:</label>
            <input type="text" name="location">
            <br><br>


            <h2>Professional Summary</h2>

            <label>Summary:</label>
            <textarea name="summary"></textarea>
            <br><br>

            <h2>Education</h2>

            <div id="education-container">

                <div class="education-entry">

                     <label>School:</label>
                     <input type="text" name="school">

                    <label>Degree:</label>
                    <input type="text" name="degree">

                    <label>Field:</label>
                    <input type="text" name="field">

                    <label>Start Year:</label>
                    <input type="text" name="start_year">

                    <label>End Year:</label>
                    <input type="text" name="end_year">

                </div>

            </div>

<button type="button" id="add-education">
    + Add Another Education
</button>
            <h2>Work Experience</h2>

            <div id="work-container">
                <div class="work-entry">
                    <label>Job Title:</label>
                    <input type="text" name="job_title">

                    <label>Company:</label>
                    <input type="text" name="company">

                    <label>Location:</label>
                    <input type="text" name="work_location">

                    <label>Start Date:</label>
                    <input type="text" name="start_date">

                    <label>End Date:</label>
                    <input type="text" name="end_date">

                    <label>Description:</label>
                    <textarea name="description"></textarea>
                </div>
            </div>
            <button type="button" id="add-work">
                + Add another Work Experience
            </button>

            <label>Job Title:</label>
            <input type="text" name="job_title">
            <br><br>

            <label>Company:</label>
            <input type="text" name="company">
            <br><br>

            <label>Location:</label>
            <input type="text" name="work_location">
            <br><br>

            <label>Start Date:</label>
            <input type="text" name="start_date">
            <br><br>

            <label>End Date:</label>
            <input type="text" name="end_date">
            <br><br>

            <label>Description:</label>
            <textarea name="description"></textarea>
            <br><br>

            <h2>Skills</h2>

           <div id="skills-container">

          <div class="skill-entry">
          <label>Skill:</label>
          <input type="text" name="skill">
    </div>

   </div>

   <button type="button" id="add-skill">
    + Add Another Skill
   </button>

            <h2>Certifications</h2>

            <label>Certification Name:</label>
            <input type="text" name="certification_name">
            <br><br>

            <label>Organization:</label>
            <input type="text" name="certification_organization">
            <br><br>

            <label>Date:</label>
            <input type="text" name="certification_date">
            <br><br>


            <h2>Projects</h2>

            <label>Project Name:</label>
            <input type="text" name="project_name">
            <br><br>

            <label>Description:</label>
            <textarea name="project_description"></textarea>
            <br><br>

            <label>Role:</label>
            <input type="text" name="project_role">
            <br><br>

            <label>Tools:</label>
            <input type="text" name="project_tools">
            <br><br>

            <label>Project Link:</label>
            <input type="text" name="project_link">
            <br><br>


            <h2>Languages</h2>

            <label>Language:</label>
            <input type="text" name="language">
            <br><br>

            <label>Proficiency:</label>
            <input type="text" name="language_proficiency">
            <br><br>


            <h2>Achievements</h2>

            <label>Title:</label>
            <input type="text" name="achievement_title">
            <br><br>

            <label>Description:</label>
            <textarea name="achievement_description"></textarea>
            <br><br>


            <h2>Volunteer Experience</h2>

            <label>Organization:</label>
            <input type="text" name="volunteer_organization">
            <br><br>

            <label>Role:</label>
            <input type="text" name="volunteer_role">
            <br><br>

            <label>Location:</label>
            <input type="text" name="volunteer_location">
            <br><br>

            <label>Start Date:</label>
            <input type="text" name="volunteer_start_date">
            <br><br>

            <label>End Date:</label>
            <input type="text" name="volunteer_end_date">
            <br><br>

            <label>Description:</label>
            <textarea name="volunteer_description"></textarea>
            <br><br>


            <h2>References</h2>

            <label>Name:</label>
            <input type="text" name="reference_name">
            <br><br>

            <label>Relationship:</label>
            <input type="text" name="reference_relationship">
            <br><br>

            <label>Organization:</label>
            <input type="text" name="reference_organization">
            <br><br>

            <label>Email:</label>
            <input type="email" name="reference_email">
            <br><br>

            <label>Phone Number:</label>
            <input type="text" name="reference_phone_number">
            <br><br>


            <button type="submit">Save Resume</button>

        </form>
        <a href="/" class="Back-to-Home">Back to Home</a>

        <script>
    const educationContainer = document.getElementById("education-container");
    const addEducationButton = document.getElementById("add-education");

    addEducationButton.addEventListener("click", function () {

        const educationEntry = document.createElement("div");

        educationEntry.className = "education-entry";

        educationEntry.innerHTML = `
            <hr>

            <label>School:</label>
            <input type="text" name="school">

            <label>Degree:</label>
            <input type="text" name="degree">

            <label>Field:</label>
            <input type="text" name="field">

            <label>Start Year:</label>
            <input type="text" name="start_year">

            <label>End Year:</label>
            <input type="text" name="end_year">
        `;

        educationContainer.appendChild(educationEntry);
    });
</script>


<script>
    const workContainer = document.getElementById("work-container");
    const addWorkButton = document.getElementById("add-work");

    addWorkButton.addEventListener("click", function () {

        const workEntry = document.createElement("div");

        workEntry.className = "work-entry";

        workEntry.innerHTML = `
            <hr>

            <label>Job Title:</label>
            <input type="text" name="job_title">

            <label>Company:</label>
            <input type="text" name="company">

            <label>Location:</label>
            <input type="text" name="work_location">

            <label>Start Date:</label>
            <input type="text" name="start_date">

            <label>End Date:</label>
            <input type="text" name="end_date">

            <label>Description:</label>
            <textarea name="description"></textarea>
        `;

        workContainer.appendChild(workEntry);
    });
</script>

<script>
    const skillsContainer = document.getElementById("skills-container");
    const addSkillButton = document.getElementById("add-skill");

    addSkillButton.addEventListener("click", function () {

        const skillEntry = document.createElement("div");

        skillEntry.className = "skill-entry";

        skillEntry.innerHTML = `
            <hr>

            <label>Skill:</label>
            <input type="text" name="skill">
        `;

        skillsContainer.appendChild(skillEntry);
    });
</script>
    </body>
</html>
