<!DOCTYPE html>
<html>
<head>
    <title>Edit Resume</title>
</head>

<body>

    <h1>Edit Resume</h1>

    <h2>Personal Information</h2>

    <form method="POST">

        <label>Name:</label>
        <input
            type="text"
            name="name"
            value="{{ resume['personal_information']['name'] }}"
        >

        <br><br>

        <label>Email:</label>
        <input
            type="email"
            name="email"
            value="{{ resume['personal_information']['email'] }}"
        >

        <br><br>

        <label>Date of Birth:</label>
        <input
            type="text"
            name="date_of_birth"
            value="{{ resume['personal_information']['date_of_birth'] }}"
        >

        <br><br>

        <label>Phone Number:</label>
        <input
            type="text"
            name="phone_number"
            value="{{ resume['personal_information']['phone_number'] }}"
        >

        <br><br>

        <label>Location:</label>
        <input
            type="text"
            name="location"
            value="{{ resume['personal_information']['location'] }}"
        >

        <br><br>

        
          <h2>Professional Summary</h2>
        <label>Summary</label>
        <br>
        <textarea
        name="summary"
        rows="6"
        cols="50"
        >{{  resume["summary"] }}</textarea>

        <br><br>
        

        <h2>Education</h2>

        {% for education in resume["education"] %}
        
        <label>School:</label>
        
        <input
        type="text"
        name="school"
        value="{{ education['school'] }}"
        >

        <br><br>

        <label>Degree:</label>
        <input
        type="text"
        name="degree"
        value="{{ education['degree'] }}"
        >

        <br><br>

        <label>Field:</label>
        <input
        type="text"
        name="field"
        value="{{ education['field'] }}"
        >

        <br><br>

        <label>Start Year:</label>
        <input
        type="text"
        name="start_year"
        value="{{ education['start_year'] }}"
        >

        <br><br>

        <label>End Year:</label>
        <input
        type="text"
        name="end_year"
        value="{{ education['end_year'] }}"
        >

        <br><br>
        {% endfor %}

        <button type="submit">Save Changes</button>
       

    
    </form>

</body>
</html>
